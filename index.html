<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>外部コミュニケーション記録</title>
<style>
/* HACCP外部コミュニケーション記録 — style.css */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#f4f4f0; --surface:#ffffff; --border:#dddbd6; --focus:#4a7c59;
  --text:#1c1c1a; --sub:#6b6966; --accent:#4a7c59; --accent-lt:#e8f2eb;
  --danger:#b93333; --danger-lt:#fce8e8; --r:8px; --shadow:0 1px 4px rgba(0,0,0,.07);
  --font:'Hiragino Kaku Gothic ProN','Hiragino Sans','Meiryo',sans-serif;
}
html { font-size: 16px; }
body { font-family: var(--font); background: var(--bg); color: var(--text);
       min-height: 100vh; -webkit-font-smoothing: antialiased; }
.hidden { display: none !important; }
.app-header { position: sticky; top: 0; z-index: 100;
  background: var(--accent); color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.13); }
.header-inner { display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px; height: 50px; }
.header-title { font-size: .95rem; font-weight: 700; letter-spacing: .03em; }
.icon-btn { background: none; border: none; color: #fff; cursor: pointer; padding: 8px;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  min-width: 44px; min-height: 44px; -webkit-tap-highlight-color: transparent; transition: background .15s; }
.icon-btn:active { background: rgba(255,255,255,.22); }
.tab-bar { display: flex; border-top: 1px solid rgba(255,255,255,.2); }
.tab-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px;
  background: none; border: none; color: rgba(255,255,255,.7);
  font-family: var(--font); font-size: .82rem; font-weight: 600; padding: 9px 8px;
  cursor: pointer; border-bottom: 3px solid transparent; transition: color .15s, border-color .15s;
  -webkit-tap-highlight-color: transparent; }
.tab-btn.active { color: #fff; border-bottom-color: #fff; }
.tab-btn:active { background: rgba(255,255,255,.12); }
.main-content { padding: 14px 14px 60px; max-width: 600px; margin: 0 auto; }
.form-section { background: var(--surface); border-radius: var(--r);
  padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
.section-title { font-size: .72rem; font-weight: 700; color: var(--sub);
  text-transform: uppercase; letter-spacing: .09em; margin-bottom: 11px;
  padding-bottom: 7px; border-bottom: 1px solid var(--border); }
.field-row { display: flex; align-items: center; gap: 8px; }
.mt8 { margin-top: 8px; }
.field-label { font-size: .83rem; color: var(--sub); white-space: nowrap; min-width: 52px; }
.req { color: var(--danger); font-size: .7rem; font-weight: 700; margin-left: 2px; }
.field-input { flex: 1; width: 100%; padding: 10px 11px;
  border: 1.5px solid var(--border); border-radius: var(--r);
  font-size: .94rem; font-family: var(--font); color: var(--text);
  background: #fff; outline: none; min-height: 44px; transition: border-color .15s; }
.field-input:focus { border-color: var(--focus); }
.field-input::placeholder { color: #c0beba; }
.field-textarea { width: 100%; padding: 10px 11px;
  border: 1.5px solid var(--border); border-radius: var(--r);
  font-size: .94rem; font-family: var(--font); color: var(--text);
  background: #fff; outline: none; resize: vertical; line-height: 1.65; transition: border-color .15s; }
.field-textarea:focus { border-color: var(--focus); }
.field-textarea::placeholder { color: #c0beba; }
.time-range { display: flex; align-items: center; gap: 6px; flex: 1; }
.time-input { flex: 1; }
.time-sep { color: var(--sub); font-size: .88rem; }
.external-entry { background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--r); padding: 11px; margin-bottom: 8px; }
.ext-entry-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.entry-label { font-size: .73rem; font-weight: 700; color: var(--accent); letter-spacing: .05em; }
.ext-fields { display: flex; flex-direction: column; gap: 7px; }
.ext-row { display: flex; align-items: center; gap: 8px; }
.ext-lbl { font-size: .8rem; color: var(--sub); min-width: 42px; }
.remove-btn { background: none; border: none; color: var(--danger); cursor: pointer; padding: 4px;
  border-radius: 4px; display: flex; align-items: center; justify-content: center;
  min-width: 36px; min-height: 36px; -webkit-tap-highlight-color: transparent; }
.remove-btn:active { background: var(--danger-lt); }
.add-btn { display: flex; align-items: center; gap: 6px; background: none;
  border: 1.5px dashed var(--border); border-radius: var(--r);
  color: var(--accent); font-size: .87rem; font-family: var(--font);
  cursor: pointer; padding: 10px 12px; width: 100%; margin-top: 4px;
  -webkit-tap-highlight-color: transparent; transition: border-color .15s, background .15s; }
.add-btn:active { background: var(--accent-lt); border-color: var(--accent); }
.add-inline-btn { background: var(--accent); color: #fff; border: none;
  border-radius: var(--r); padding: 0 14px; font-size: .87rem; font-family: var(--font);
  cursor: pointer; white-space: nowrap; min-height: 44px; min-width: 56px;
  -webkit-tap-highlight-color: transparent; transition: background .15s; }
.add-inline-btn:active { background: #38623f; }
.chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: flex; align-items: center; gap: 4px; background: var(--accent-lt);
  color: var(--accent); border-radius: 20px; padding: 5px 10px; font-size: .84rem; font-weight: 600; }
.chip-remove { background: none; border: none; color: var(--accent); cursor: pointer;
  padding: 0; font-size: 1.05rem; line-height: 1; opacity: .7;
  min-width: 20px; min-height: 20px; display: flex; align-items: center; justify-content: center; }
.format-toggle { display: flex; gap: 10px; }
.format-option { flex: 1; cursor: pointer; }
.format-option input[type="radio"] { display: none; }
.format-label { display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 11px 8px; border: 2px solid var(--border); border-radius: var(--r);
  font-size: .92rem; font-weight: 600; color: var(--sub); transition: all .15s; cursor: pointer; }
.format-option input:checked + .format-label {
  border-color: var(--accent); background: var(--accent-lt); color: var(--accent); }
.action-area { padding: 6px 0 16px; display: flex; gap: 10px; }
.save-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px;
  background: #fff; color: var(--accent); border: 2px solid var(--accent);
  border-radius: var(--r); padding: 14px 8px; font-size: .95rem; font-weight: 700;
  font-family: var(--font); cursor: pointer; min-height: 52px;
  -webkit-tap-highlight-color: transparent; transition: background .15s; }
.save-btn:active { background: var(--accent-lt); }
.submit-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px;
  background: var(--accent); color: #fff; border: none; border-radius: var(--r);
  padding: 14px 8px; font-size: .95rem; font-weight: 700; font-family: var(--font);
  cursor: pointer; min-height: 52px; -webkit-tap-highlight-color: transparent;
  transition: background .15s, transform .1s; }
.submit-btn:active { background: #38623f; transform: scale(.98); }
.list-toolbar { margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
.date-filter { background: var(--surface); border-radius: var(--r); padding: 10px 12px; box-shadow: var(--shadow); }
.date-filter-row { display: flex; align-items: center; gap: 6px; }
.date-filter-lbl { font-size: .8rem; color: var(--sub); white-space: nowrap; min-width: 28px; }
.date-filter-input { flex: 1; min-width: 0; min-height: 40px; padding: 7px 8px; font-size: .88rem; }
.date-filter-sep { color: var(--sub); font-size: .88rem; white-space: nowrap; }
.filter-clear-btn { background: none; border: 1.5px solid var(--border); border-radius: var(--r);
  color: var(--sub); cursor: pointer; padding: 0; display: flex; align-items: center;
  justify-content: center; min-width: 36px; min-height: 36px; flex-shrink: 0;
  transition: border-color .15s, color .15s; -webkit-tap-highlight-color: transparent; }
.filter-clear-btn:active { border-color: var(--danger); color: var(--danger); }
.filter-summary { margin-top: 7px; padding: 5px 8px; background: var(--accent-lt);
  border-radius: 6px; font-size: .78rem; color: var(--accent); font-weight: 600; }
.record-card { background: var(--surface); border-radius: var(--r);
  padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
.card-date { font-size: .78rem; color: var(--sub); margin-bottom: 4px; }
.card-dest { font-size: .97rem; font-weight: 700; margin-bottom: 6px; line-height: 1.4; }
.card-meta { font-size: .8rem; color: var(--sub); display: flex; gap: 12px; flex-wrap: wrap; }
.card-actions { display: flex; gap: 8px; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
.card-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px;
  padding: 9px 6px; border-radius: var(--r); font-size: .82rem; font-weight: 600;
  font-family: var(--font); cursor: pointer; border: none; min-height: 40px;
  -webkit-tap-highlight-color: transparent; transition: background .15s; }
.card-btn-edit { background: var(--accent-lt); color: var(--accent); }
.card-btn-out  { background: var(--accent); color: #fff; }
.card-btn-del  { background: var(--danger-lt); color: var(--danger); }
.card-btn-edit:active { background: #d0e8d6; }
.card-btn-out:active  { background: #38623f; }
.card-btn-del:active  { background: #f5c6c6; }
.list-empty { text-align: center; padding: 48px 16px; color: var(--sub); font-size: .9rem; line-height: 1.8; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.48);
  z-index: 200; display: flex; align-items: flex-end; }
.modal-overlay.hidden { display: none !important; }
.modal-box { background: var(--surface); border-radius: 16px 16px 0 0; width: 100%; max-width: 600px;
  margin: 0 auto; max-height: 88vh; display: flex; flex-direction: column; }
.confirm-box { max-height: none; }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 0; }
.modal-title { font-size: 1rem; font-weight: 700; }
.close-btn { background: none; border: none; color: var(--sub); cursor: pointer; padding: 6px;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  min-width: 38px; min-height: 38px; -webkit-tap-highlight-color: transparent; }
.close-btn:active { background: var(--bg); }
.modal-body { overflow-y: auto; padding: 14px; flex: 1; }
.modal-footer { padding: 10px 14px 28px; border-top: 1px solid var(--border); }
.modal-footer .submit-btn { flex: none; width: 100%; }
.role-legend { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.role-legend-note { font-size: .75rem; color: var(--sub); }
.role-badge { display: inline-flex; align-items: center; font-size: .72rem; font-weight: 700;
  padding: 2px 8px; border-radius: 10px; }
.role-badge.role-rsp { background: var(--accent-lt); color: var(--accent); }
.role-badge.role-crt { background: #e8eef8; color: #3a5fa0; }
.member-item { display: flex; align-items: center; gap: 8px; padding: 9px 11px;
  border: 1px solid var(--border); border-radius: var(--r); background: var(--bg); margin-bottom: 6px; }
.member-name { flex: 1; font-size: .92rem; }
.member-checks { display: flex; gap: 6px; }
.role-check { display: none; }
.role-check-label { display: inline-flex; align-items: center; font-size: .72rem; font-weight: 700;
  padding: 4px 9px; border-radius: 10px; border: 1.5px solid var(--border); color: var(--sub);
  background: #fff; cursor: pointer; user-select: none; transition: all .15s; min-height: 30px; }
.role-check.rsp:checked + .role-check-label { background: var(--accent-lt); color: var(--accent); border-color: var(--accent); }
.role-check.crt:checked + .role-check-label { background: #e8eef8; color: #3a5fa0; border-color: #7aa0d4; }
.settings-add-row { display: flex; gap: 8px; margin-top: 8px; }
.confirm-msg { font-size: .95rem; line-height: 1.7; }
.confirm-sub { font-size: .82rem; color: var(--sub); }
.confirm-footer { display: flex; gap: 10px; }
.cancel-btn { flex: 1; background: var(--bg); color: var(--sub); border: 1.5px solid var(--border);
  border-radius: var(--r); padding: 14px; font-size: .95rem; font-weight: 700;
  font-family: var(--font); cursor: pointer; min-height: 50px; -webkit-tap-highlight-color: transparent; }
.cancel-btn:active { background: #e8e6e2; }
.danger-btn { flex: 1; background: var(--danger); color: #fff; border: none; border-radius: var(--r);
  padding: 14px; font-size: .95rem; font-weight: 700; font-family: var(--font);
  cursor: pointer; min-height: 50px; -webkit-tap-highlight-color: transparent; transition: background .15s; }
.danger-btn:active { background: #922828; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(16px);
  background: #1c1c1a; color: #fff; padding: 9px 20px; border-radius: 20px;
  font-size: .86rem; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  z-index: 500; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,.82); z-index: 400;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.spinner { width: 34px; height: 34px; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%; animation: spin .75s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: .88rem; color: var(--sub); }
/* ヘッダーカラー上書き */
.tab-bar { background: #f0f2ef !important; }
.tab-btn { color: #1a2e22 !important; }
.tab-btn.active { color: #15803d !important; border-bottom-color: #15803d !important; }
.tab-btn svg { color: inherit !important; stroke: currentColor !important; }
</style>
</head>

  <!-- 入力フォーム画面 -->
  <main id="view-form" class="main-content">
    <form id="record-form" autocomplete="off">
      <input type="hidden" id="edit-id">
      <section class="form-section">
        <h2 class="section-title">実施日時</h2>
        <div class="field-row">
          <label class="field-label" for="impl-date">年月日<span class="req">*</span></label>
          <input type="date" id="impl-date" class="field-input" required>
        </div>
        <div class="field-row mt8">
          <label class="field-label">時　刻</label>
          <div class="time-range">
            <input type="time" id="time-from" class="field-input time-input">
            <span class="time-sep">〜</span>
            <input type="time" id="time-to" class="field-input time-input">
          </div>
        </div>
      </section>
      <section class="form-section">
        <h2 class="section-title">実施場所</h2>
        <textarea id="impl-place" class="field-textarea" rows="2" placeholder="例：ファーム事務所（オンライン）"></textarea>
      </section>
      <section class="form-section">
        <h2 class="section-title">外部コミュニケーション先</h2>
        <div id="external-list"></div>
        <button type="button" id="btn-add-ext" class="add-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          所属・氏名を追加
        </button>
      </section>
      <section class="form-section">
        <h2 class="section-title">対応者</h2>
        <div id="respondent-chips" class="chip-list"></div>
        <div class="field-row mt8">
          <select id="respondent-select" class="field-input"><option value="">対応者を選択</option></select>
          <button type="button" id="btn-add-respondent" class="add-inline-btn">追加</button>
        </div>
      </section>
      <section class="form-section">
        <h2 class="section-title">内　容</h2>
        <textarea id="content" class="field-textarea" rows="5" placeholder="打ち合わせ内容を記入してください"></textarea>
      </section>
      <section class="form-section">
        <h2 class="section-title">特記事項</h2>
        <textarea id="remarks" class="field-textarea" rows="3" placeholder="特記事項があれば記入してください"></textarea>
      </section>
      <section class="form-section">
        <h2 class="section-title">作成情報</h2>
        <div class="field-row">
          <label class="field-label" for="created-date">作成日</label>
          <input type="date" id="created-date" class="field-input">
        </div>
        <div class="field-row mt8">
          <label class="field-label" for="creator-select">作成者<span class="req">*</span></label>
          <select id="creator-select" class="field-input" required>
            <option value="">選択してください</option>
          </select>
        </div>
      </section>
      <section class="form-section">
        <h2 class="section-title">出力形式</h2>
        <div class="format-toggle">
          <label class="format-option">
            <input type="radio" name="output-format" value="pdf" checked>
            <span class="format-label">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
              </svg>
              PDF
            </span>
          </label>
          <label class="format-option">
            <input type="radio" name="output-format" value="excel">
            <span class="format-label">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <path d="M3 9h18M3 15h18M9 3v18"/>
              </svg>
              Excel
            </span>
          </label>
        </div>
      </section>
      <div class="action-area">
        <button type="button" id="btn-save" class="save-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
          </svg>
          保存する
        </button>
        <button type="submit" class="submit-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          出力する
        </button>
      </div>
    </form>
  </main>

  <!-- 記録一覧画面 -->
  <main id="view-list" class="main-content hidden">
    <div class="list-toolbar">
      <input type="text" id="search-box" class="field-input" placeholder="キーワードで絞り込み">
      <div class="date-filter">
        <div class="date-filter-row">
          <span class="date-filter-lbl">期間</span>
          <input type="date" id="filter-date-from" class="field-input date-filter-input">
          <span class="date-filter-sep">〜</span>
          <input type="date" id="filter-date-to" class="field-input date-filter-input">
          <button type="button" id="btn-filter-clear" class="filter-clear-btn" aria-label="期間クリア">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div id="filter-summary" class="filter-summary hidden"></div>
      </div>
    </div>
    <div id="record-list"><div class="list-empty">読み込み中...</div></div>
  </main>

  <!-- 設定モーダル -->
  <div id="modal-settings" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">設定 — 人物リスト</h3>
        <button type="button" id="btn-close-settings" class="close-btn" aria-label="閉じる">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="role-legend">
          <span class="role-badge role-rsp">対応者</span>
          <span class="role-badge role-crt">作成者</span>
          <span class="role-legend-note">として使う場合チェック</span>
        </div>
        <div id="member-list"></div>
        <div class="settings-add-row">
          <input type="text" id="new-member" class="field-input" placeholder="氏名を入力">
          <button type="button" id="btn-add-member" class="add-inline-btn">追加</button>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="btn-save-settings" class="submit-btn">保存して閉じる</button>
      </div>
    </div>
  </div>

  <!-- 削除確認モーダル -->
  <div id="modal-confirm" class="modal-overlay hidden">
    <div class="modal-box confirm-box">
      <div class="modal-header"><h3 class="modal-title">削除の確認</h3></div>
      <div class="modal-body">
        <p class="confirm-msg">この記録を削除しますか？<br><span class="confirm-sub">この操作は元に戻せません。</span></p>
      </div>
      <div class="modal-footer confirm-footer">
        <button type="button" id="btn-confirm-cancel" class="cancel-btn">キャンセル</button>
        <button type="button" id="btn-confirm-ok" class="danger-btn">削除する</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>
  <div id="loading" class="loading-overlay hidden">
    <div class="spinner"></div>
    <div id="loading-text" class="loading-text">処理中...</div>
  </div>

</div>
